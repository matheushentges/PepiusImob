services:
  caddy:
    image: caddy:2-alpine
    container_name: pepius-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.integrations:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - n8n
      - evolution-api

  n8n:
    image: n8nio/n8n:latest
    container_name: pepius-n8n
    restart: unless-stopped
    init: true
    environment:
      - N8N_HOST=n8n.157.151.10.201.sslip.io
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.157.151.10.201.sslip.io/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n-data:/home/node/.n8n
    expose:
      - "5678"

  postgres-evolution:
    image: postgres:16-alpine
    container_name: pepius-postgres-evo
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password_2026
      POSTGRES_DB: evolution
    volumes:
      - postgres-evo-data:/var/lib/postgresql/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: pepius-evolution
    restart: unless-stopped
    init: true
    environment:
      - SERVER_URL=https://evo.157.151.10.201.sslip.io
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-pepius_secret_token_2026}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password_2026@postgres-evolution:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DEL_INSTANCE=false
    volumes:
      - evolution-instances:/evolution/instances
    expose:
      - "8080"
    depends_on:
      - postgres-evolution

volumes:
  n8n-data:
  evolution-instances:
  postgres-evo-data:
  caddy-data:
  caddy-config:
