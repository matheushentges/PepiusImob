services:
  caddy:
    image: caddy:2-alpine
    container_name: pepius-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.integrations:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - supabase
    depends_on:
      - pepius-app
      - n8n
      - evolution-api

  pepius-app:
    image: pepius-imob:latest
    container_name: pepius-app
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://api.imob.157.151.10.201.sslip.io}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://imob.157.151.10.201.sslip.io}
    restart: unless-stopped
    init: true
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://imob.157.151.10.201.sslip.io}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://api.imob.157.151.10.201.sslip.io}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE}
      - SUPABASE_INTERNAL_URL=http://supabase-envoy:8000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q}
      - PEPIUS_TENANT_ID=${PEPIUS_TENANT_ID:-64377038-0f9c-40fa-bdac-cd928924f624}
      - LEAD_RATE_LIMIT_PEPPER=${LEAD_RATE_LIMIT_PEPPER:-pepius_secret_pepper_rate_limit_2026_super_secure}
      - LICENSE_DEV_BYPASS=false
      - LICENSE_CONTROL_PLANE_ENABLED=false
      - PEPIUS_LICENSE_API_URL=${PEPIUS_LICENSE_API_URL:-https://pepius-imob.vercel.app}
      - 'LICENSE_TRUSTED_PUBLIC_KEYS_JSON={"pepius-licensing-2026-10":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEA6yy3AffJjAJbzI+9d6FYQoa1XXIFaXDBOa9nlXfME8Y=\n-----END PUBLIC KEY-----\n"}'
      - LICENSE_STATE_DIR=/app/.local/license-state
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-pepius_secret_token_2026}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/pepius-lead
      - PEPIUS_N8N_WEBHOOK_URL=http://n8n:5678/webhook/pepius-lead
      - PEPIUS_N8N_LEAD_WEBHOOK_URL=http://n8n:5678/webhook/pepius-lead
      - PEPIUS_N8N_VISIT_WEBHOOK_URL=http://n8n:5678/webhook/pepius-visit
      - PEPIUS_N8N_CALENDAR_SLOTS_URL=http://n8n:5678/webhook/pepius-slots
    volumes:
      - pepius-license-data:/app/.local/license-state
    expose:
      - "3000"
    networks:
      - default
      - supabase

  n8n:
    image: n8nio/n8n:latest
    container_name: pepius-n8n
    restart: unless-stopped
    init: true
    environment:
      - N8N_HOST=n8n.157.151.10.201.sslip.io
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.157.151.10.201.sslip.io/
      - N8N_EDITOR_BASE_URL=https://n8n.157.151.10.201.sslip.io/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n-data:/home/node/.n8n
    expose:
      - "5678"
    networks:
      - default
      - supabase

  postgres-evolution:
    image: postgres:16-alpine
    container_name: pepius-postgres-evo
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password_2026
      POSTGRES_DB: evolution
    volumes:
      - postgres-evo-data:/var/lib/postgresql/data
    networks:
      - default

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: pepius-evolution
    restart: unless-stopped
    init: true
    environment:
      - SERVER_URL=https://evo.157.151.10.201.sslip.io
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-pepius_secret_token_2026}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password_2026@postgres-evolution:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DEL_INSTANCE=false
      - N8N_ENABLED=true
      - EVOAI_ENABLED=true
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    volumes:
      - evolution-instances:/evolution/instances
    expose:
      - "8080"
    depends_on:
      - postgres-evolution
    networks:
      - default

networks:
  default:
    name: deployment_default
  supabase:
    external: true
    name: supabase_default

volumes:
  pepius-license-data:
  n8n-data:
  evolution-instances:
  postgres-evo-data:
  caddy-data:
  caddy-config:

