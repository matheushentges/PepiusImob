services:
  n8n:
    image: n8nio/n8n:latest
    container_name: pepius-n8n
    restart: unless-stopped
    init: true
    environment:
      - N8N_HOST=${N8N_HOST:-157.151.10.201}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://157.151.10.201:5678/}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "5678:5678"

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: pepius-evolution
    restart: unless-stopped
    init: true
    environment:
      - SERVER_URL=${SERVER_URL:-http://157.151.10.201:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-pepius_secret_token_2026}
      - DATABASE_ENABLED=false
      - DEL_INSTANCE=false
    volumes:
      - evolution-instances:/evolution/instances
    ports:
      - "8080:8080"

volumes:
  n8n-data:
  evolution-instances:
